name: Worker Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      # The worker bundles the ingestion package (worker/package.json:
      # "marsad-ingestion": "file:../ingestion") and runs it compiled
      # (`node dist/index.js` → ingestion/dist). So an ingestion-only change
      # MUST redeploy the worker — without this path the fix ships nowhere.
      - "ingestion/**"
      # Shared TS (LLM gateway, entity types) is compiled into the worker
      # (06-infra-cost.md §3.1), so changes there must redeploy it too.
      - "src/lib/shared/**"
      - "src/lib/llm/**"
      - ".github/workflows/worker-deploy.yml"

# One deploy at a time; never cancel a restart mid-flight.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Secrets are not readable inside job-level `if:` expressions, so a tiny
  # preflight job exports "configured" as an output. Until the owner provisions
  # the VPS and sets VPS_HOST / VPS_SSH_KEY, the workflow skips gracefully
  # instead of failing every push to main.
  preflight:
    name: check VPS secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [[ -n "$VPS_HOST" && -n "$VPS_SSH_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_HOST / VPS_SSH_KEY secrets not set — VPS not provisioned yet; skipping worker deploy."
          fi

  deploy:
    name: deploy to VPS
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/marsad_deploy
          chmod 600 ~/.ssh/marsad_deploy

      - name: Build and restart marsad-worker on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          # Defaults match the cloud-init recipe (infra/cloud-init.yaml): the SSH key
          # authorizes the `deploy` user, and the repo is cloned to /opt/marsad.
          # Both are still override-able via secret/var for a differently-laid-out box.
          VPS_USER: ${{ secrets.VPS_USER || 'deploy' }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/marsad' }}
          DEPLOY_SHA: ${{ github.sha }}
        # Deploys the exact workflow SHA (not branch tip) so "rollback =
        # re-run this workflow on the previous commit" holds.
        # Full `npm ci` first because the TypeScript build needs devDependencies;
        # `npm prune --omit=dev` afterwards leaves a production-only node_modules.
        run: |
          ssh -i ~/.ssh/marsad_deploy \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" \
              APP_DIR="$APP_DIR" DEPLOY_SHA="$DEPLOY_SHA" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          git fetch origin
          git reset --hard "$DEPLOY_SHA"
          # Build the ingestion package FIRST. The worker depends on it via
          # `marsad-ingestion: file:../ingestion` and runs compiled
          # (`node dist/index.js`), so at runtime it resolves marsad-ingestion to
          # ingestion/dist (the package's `default` export). There is no prepare
          # hook, so `git reset` refreshes ingestion/src but NOT ingestion/dist —
          # without this explicit build the worker would keep running stale
          # ingestion JS (and the worker's own tsc build would fail on the missing
          # ingestion .d.ts). Build ingestion, then the worker copies the fresh dist.
          cd ingestion
          npm ci
          npm run build
          cd ../worker
          npm ci
          npm run build
          npm prune --omit=dev
          # `deploy` is a non-root user (NOPASSWD sudo per cloud-init); managing a
          # system unit needs sudo — bare `systemctl restart` would fail non-interactively.
          sudo systemctl restart marsad-worker
          sleep 5
          sudo systemctl is-active --quiet marsad-worker || {
            echo "marsad-worker failed to start; recent logs:" >&2
            sudo journalctl -u marsad-worker -n 50 --no-pager >&2
            exit 1
          }
          echo "marsad-worker restarted OK at $DEPLOY_SHA"
          REMOTE
